# Render blueprint: the Python backend (web service) and the website (static site), both on Render.
services:
  - type: web
    name: invest-detroit-underwriter-api
    runtime: python
    plan: free
    rootDir: underwriter-tool
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn underwriter.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/status
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: ANTHROPIC_API_KEY
        sync: false # you type this into Render's dashboard; it is never stored in git
      - key: ALLOWED_ORIGINS
        sync: false # the website's Render address, e.g. https://invest-detroit-underwriter.onrender.com (leave empty to allow any site)
      - key: UNDERWRITER_DATA_DIR
        value: /tmp/underwriter
      - key: UNDERWRITER_RETENTION_HOURS
        value: "24"

  - type: web
    name: invest-detroit-underwriter
    runtime: static
    rootDir: .
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: VITE_API_BASE
        sync: false # the backend's Render address, e.g. https://invest-detroit-underwriter-api.onrender.com (no slash at the end)
